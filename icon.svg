<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Royal Blue Background -->
  <rect width="512" height="512" rx="112" fill="#2563EB"/>
  <!-- Subtle Gradient Overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- Outer Ring (Cyan) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06B6D4" stroke-width="16" opacity="0.8"/>
  
  <!-- "DD" Text (White) -->
  <text x="256" y="325" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="210" fill="#ffffff" text-anchor="middle" letter-spacing="-10">DD</text>
  
  <!-- Magenta Accent Dot -->
  <circle cx="390" cy="180" r="24" fill="#D946EF" />
</svg>
